<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランク戦タクティクス v6.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE6; --panel:#F5F6F3; --ink:#1C232D; --muted:#5B6470; --line:#C5CBC3;
  --road:#F1F2EE; --bld:#3B4656; --b1:#C9CED3; --b2:#A3ACB7; --b3:#77828F; --b4:#4B5666; --hnc:#2B333D; --river:#A7C9DB; --high:#DACDAA;
  --reach:rgba(236,182,30,.5); --btn:#1C232D; --btnink:#F5F6F3;
  --t0:#2A64C6; --t1:#C93D31; --t2:#22845A; --t3:#A8770C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --panel:#18202A; --ink:#E5E8EC; --muted:#96A0AC; --line:#2D3745;
    --road:#1C2430; --bld:#4A576B; --b1:#2A3340; --b2:#364252; --b3:#465569; --b4:#5A6C86; --hnc:#C9D1DB; --river:#22465B; --high:#4B4330;
    --reach:rgba(236,182,30,.35); --btn:#E5E8EC; --btnink:#10151C;
    --t0:#5A90EC; --t1:#E65E50; --t2:#3DB27F; --t3:#D9A532; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --ink:#E5E8EC; --muted:#96A0AC; --line:#2D3745;
  --road:#1C2430; --bld:#4A576B; --b1:#2A3340; --b2:#364252; --b3:#465569; --b4:#5A6C86; --hnc:#C9D1DB; --river:#22465B; --high:#4B4330;
  --reach:rgba(236,182,30,.35); --btn:#E5E8EC; --btnink:#10151C;
  --t0:#5A90EC; --t1:#E65E50; --t2:#3DB27F; --t3:#D9A532; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;line-height:1.25;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--t0);outline-offset:2px}
#app{max-width:1080px;margin:0 auto;padding:16px}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:6px;padding:11px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.top h2{font-size:22px}
.home{max-width:580px;margin:4vh auto 0}
.home h1{font-size:clamp(34px,9vw,52px)}
.home .sub{margin:6px 0 24px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:8px}
.code-in{width:7.5em;text-transform:uppercase;letter-spacing:.2em;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--road);font-weight:700}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{padding-left:1.2em;margin:8px 0 0}
details.rules li{margin:4px 0}
.fld{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fld input,.fld select{padding:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--road);min-width:0}
select.inl{padding:7px;border:1.5px solid var(--line);border-radius:6px;background:var(--road);max-width:100%}
.members{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mem{background:var(--road);border:1px solid var(--line);border-radius:8px;padding:10px}
.memhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.memhead input{width:7em;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-weight:700;padding:2px 0}
.pos{font-size:12px;color:var(--muted)}
.slots{display:grid;gap:6px;font-size:13px;margin-bottom:8px}
.slots>div{display:grid;grid-template-columns:3em 1fr 1fr;gap:6px;align-items:center}
.slots select{padding:5px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:13px;min-width:0}
.sl{color:var(--muted)}
.sb{display:grid;grid-template-columns:4.6em 1fr 3.6em;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.sb i{height:7px;background:var(--line);border-radius:4px;overflow:hidden;display:block}
.sb i::before{content:"";display:block;height:100%;width:var(--w);background:var(--fill,var(--muted))}
.sb b{text-align:right}
.sb em{font-style:normal;font-size:11px;margin-left:2px}
.up{color:var(--t2)} .dn{color:var(--t1)}
.sb.rolled i::before{background:var(--t0)}
.derived{border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.tlist{display:grid;gap:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tcard h3{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;margin:6px 0}
.stats div{background:var(--road);border-radius:5px;padding:3px 4px;text-align:center;color:var(--muted)}
.stats b{display:block;font-size:16px;color:var(--ink)}
.slot{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.roomcode{font-family:"Dela Gothic One",sans-serif;font-size:40px;letter-spacing:.15em}
.seat{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.seat:last-child{border-bottom:0}
.game{display:grid;gap:14px}
@media (min-width:860px){.game{grid-template-columns:minmax(0,560px) 1fr;align-items:start}}
.hud{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.hud .rd{font-family:"Dela Gothic One",sans-serif;font-size:20px}
.chip{padding:4px 10px;border-radius:5px;background:var(--c);color:#fff;font-weight:700;font-size:14px}
.scores{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.scores span{display:inline-flex;align-items:center;gap:5px}
.board{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%;max-width:560px;touch-action:manipulation}
.c{aspect-ratio:1;border:0;padding:0;position:relative;display:grid;place-items:center;background:var(--road)}
.c.bd{background:var(--bld);cursor:default}
.c.rv{background:var(--river)}
.c.hi{background:var(--high);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.08) 4px 5px)}
.c.reach::after{content:"";position:absolute;inset:0;background:var(--reach);pointer-events:none}
.c.pth::before{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:var(--pc);opacity:.7}
.gtok{width:66%;height:66%;border-radius:50%;border:2px dashed var(--c);display:grid;place-items:center;color:var(--c);font-weight:700;font-size:clamp(9px,2.3vw,13px);position:relative;z-index:1}
.tok{position:relative;z-index:1;width:82%;height:82%;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:clamp(8px,1.7vw,13px);line-height:1}
.tok i{position:absolute;left:12%;right:12%;bottom:-3px;height:3px;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden}
.tok i::before{content:"";display:block;height:100%;width:var(--hp);background:#fff}
.tok.bag{background:transparent;color:var(--c);border:1.5px dashed var(--c)}
.tok.sel{box-shadow:0 0 0 3px var(--ink)}
.tok.atk{box-shadow:0 0 0 3px var(--reach)}
.tok.hurt{outline:3px solid var(--t1);outline-offset:1px}
.tok.ko{background:transparent;border:2px solid var(--muted);color:var(--muted)}
.blip{width:44%;height:44%;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:no-preference){.blip{animation:ping 1.6s ease-out infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(120,130,140,.55)}100%{box-shadow:0 0 0 8px rgba(120,130,140,0)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{font-size:17px;margin-bottom:2px}
.hp{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.hp b{display:block;height:100%;background:var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.opt{background:var(--road);border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 0}
.ulist{display:grid;gap:6px;margin:8px 0}
.ubtn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--road);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;text-align:left}
.ubtn[aria-pressed="true"]{border-color:var(--ink)}
.log{margin-top:12px;font-size:13px}
.log ol{list-style:none;padding:0;margin:6px 0 0}
.log li{padding:3px 0;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;padding:24px;text-align:center}
.overlay h2{font-size:28px;color:var(--c);margin-bottom:8px}
.result{list-style:none;padding:0}
.result li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:7px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.bwrap{position:relative;width:100%;max-width:560px}
.fans{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none;overflow:visible}
.tok.unk{background:transparent;color:var(--c);border:2px solid var(--c)}
.ctl{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.ctl h4{margin:0 0 4px;font-size:13px}
.rng{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.rng input{flex:1}
.aimrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.aimrow .opt{padding:5px 10px}
.opt.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.execbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.tick{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.tick b{display:block;height:100%;background:var(--ink)}
.qbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qbar .opt{padding:6px 10px}
.qbar .sep{flex-basis:100%;height:0}
.board.drag{touch-action:none}
.c.b1{background:var(--b1)}.c.b2{background:var(--b2)}.c.b3{background:var(--b3)}.c.b4{background:var(--b4)}
.hn{font-size:clamp(6px,1.3vw,10px);font-weight:700;color:var(--hnc);opacity:.85;pointer-events:none}
.c.b3 .hn,.c.b4 .hn{color:#fff}
#board{overflow-x:auto;max-width:100%}
.game>div{min-width:0}
.c{min-width:0;overflow:visible;line-height:1}
.blip{line-height:1;font-size:clamp(6px,1.2vw,10px)}
.hn{line-height:1}
.gtok{line-height:1}
#board.zoom .bwrap{width:1344px;max-width:none}
#board.zoom .tok{font-size:13px}
#board.zoom .hn{font-size:10px}
.dhint{font-size:12px;color:var(--muted)}

/* v0.9 readability */
body{font-size:15.5px}
.small{font-size:13.5px}
.card h2{font-size:19px}
.mem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.memhead{margin-bottom:10px}
.memhead input{font-size:18px;width:7.5em}
.pos{font-size:12px;color:var(--ink);background:var(--road);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tgrid h5{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.tslot{display:grid;grid-template-columns:1.1em 1fr;gap:4px;align-items:center;margin:5px 0}
.tslot span{font-size:11px;color:var(--muted);text-align:center}
.tslot select{width:100%;min-width:0;padding:8px 6px;border:1.5px solid var(--line);border-radius:7px;background:var(--road);font-size:14px}
.tslot select.none{color:var(--muted)}
.abil{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
.hex{width:min(230px,100%);height:auto;flex:none}
.hex .lab{font-size:11px;fill:var(--muted)}
.hex .val{font-size:13px;font-weight:700;fill:var(--ink)}
.stl{flex:1;min-width:130px;font-size:13.5px}
.stl div{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.stl div:last-child{border-bottom:0}
.stl h6{margin:6px 0 2px;font-size:11.5px;color:var(--muted);font-weight:700}
.stl em{font-style:normal;font-size:11.5px;margin-left:4px}
.tdesc{margin:10px 0;font-size:13px}
.tdesc summary{cursor:pointer;color:var(--muted)}
.tdesc p{margin:6px 0 0;line-height:1.7}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}
.mini svg{width:100%;max-width:110px;height:auto}
.mini b{display:block;font-size:13px}
.mini span{font-size:11.5px;color:var(--muted)}
.hud{display:block;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.crow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clab{font-size:12px;color:var(--muted);min-width:2.6em}
.crow .opt{padding:6px 11px}
.uchip{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px;border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:8px;background:var(--road);min-width:88px;text-align:left}
.uchip[aria-pressed="true"]{border-color:var(--ink);border-left-color:var(--c);box-shadow:inset 0 0 0 1px var(--ink)}
.uchip b{font-size:14px}
.uchip i{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.uchip i u{display:block;height:100%;background:var(--c);text-decoration:none}
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stile{border:1.5px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--road);display:flex;justify-content:space-between;gap:6px;align-items:center;cursor:pointer;text-align:left}
.stile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stile small{display:block;color:var(--muted);font-size:11.5px}
.stile b{display:block;font-size:14.5px}
.cycb{border:1.5px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;font-weight:700}
.chint{font-size:12px;color:var(--muted);margin:0}
.legend{font-size:12px}
.crow.focus{background:var(--road);border-radius:8px;padding:6px 8px;border-left:4px solid var(--t1)}
.nextbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-2px}
.nextbar b{display:block;height:100%;width:100%;background:var(--t0);transform-origin:left;animation-name:fillx;animation-timing-function:linear;animation-fill-mode:both}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.nextbar{display:none}}
.fxl{z-index:3}
.fx{animation-duration:1.2s;animation-fill-mode:both;animation-timing-function:ease-out;pointer-events:none;transform-box:fill-box;transform-origin:center}
.fx-shot{stroke-width:.16;stroke-linecap:round;fill:none;stroke-dasharray:.28 2;animation-name:fxshot;animation-duration:.55s;animation-timing-function:linear}
@keyframes fxshot{from{stroke-dashoffset:.28}to{stroke-dashoffset:-1}}
.fx-trail{stroke-width:.06;stroke-linecap:round;animation-name:fxtrail}
@keyframes fxtrail{0%{opacity:0}15%{opacity:.7}100%{opacity:0}}
.fx-slash{fill:none;stroke-width:.2;stroke-linecap:round;stroke-dasharray:1 1;animation-name:fxslash;animation-duration:.7s}
@keyframes fxslash{0%{stroke-dashoffset:1;opacity:1}45%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.fx-hit{fill:none;stroke:var(--t1);stroke-width:.14;animation-name:fxring;animation-delay:.3s}
@keyframes fxring{0%{transform:scale(.3);opacity:0}25%{opacity:1}100%{transform:scale(1.7);opacity:0}}
.fx-sh{fill:none;stroke:#fff;stroke-width:.12;stroke-dasharray:.35 .2;animation-name:fxring}
.fx-blast{fill:#E8892A;fill-opacity:.4;stroke:#E8892A;stroke-width:.08;animation-name:fxblast}
@keyframes fxblast{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:0}}
.fx-num{font-size:.9px;font-weight:700;fill:var(--t1);stroke:var(--bg);stroke-width:.18px;paint-order:stroke;animation-name:fxfloat}
.fx-num.crit{font-size:1.15px}
.fx-num.lead{fill:#8A5CD6}
.fx-miss{font-size:.75px;font-weight:700;fill:var(--muted);stroke:var(--bg);stroke-width:.16px;paint-order:stroke;animation-name:fxfloat}
@keyframes fxfloat{0%{transform:translateY(.4px);opacity:0}20%{transform:translateY(0);opacity:1}75%{opacity:1}100%{transform:translateY(-.5px);opacity:0}}
.fx-ko{fill:none;stroke:var(--ink);stroke-width:.18;animation-name:fxring;animation-duration:1.4s}
.fx-kot{font-size:.8px;font-weight:700;fill:var(--ink);stroke:var(--bg);stroke-width:.18px;paint-order:stroke;animation-name:fxfloat;animation-duration:1.4s}
@media (prefers-reduced-motion:reduce){.fx{animation-duration:.01s!important}.fx-num,.fx-miss,.fx-kot{animation:none;opacity:1}.fx-shot,.fx-slash,.fx-hit,.fx-sh,.fx-blast,.fx-ko,.fx-trail{display:none}}
.evt{list-style:none;padding:0;margin:6px 0 0;min-height:1.6em;font-size:13px}
.evt li{padding:3px 8px;border-left:4px solid var(--c);background:var(--panel);border-radius:4px;margin-bottom:3px}
.evt li.hurt{background:color-mix(in srgb,var(--t1) 14%,var(--panel))}
.evt li.mine{background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.evt em{font-style:normal;font-weight:700;color:var(--t1)}
textarea{border:1.5px solid var(--line);border-radius:6px;background:var(--road);padding:6px;font-family:ui-monospace,Menlo,monospace}
.fx-blk{font-size:.75px;font-weight:700;fill:#fff;stroke:var(--ink);stroke-width:.16px;paint-order:stroke;animation-name:fxfloat}

#board{position:relative}
.ulayer{position:absolute;inset:1px;pointer-events:none;z-index:2}
.uw{position:absolute;width:calc(100% / 48);height:calc(100% / 48);display:grid;place-items:center;transition:left .5s cubic-bezier(.3,.7,.3,1),top .5s cubic-bezier(.3,.7,.3,1)}
.uw .tok{width:74%;height:74%;position:relative;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.uw.h1 .tok{transform:translateY(-1px);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.uw.h2 .tok{transform:translateY(-2px);box-shadow:0 3px 4px rgba(0,0,0,.35)}

body{background:var(--bg);color:var(--ink)}
.card,.mem,.panel,.tcard,.mcard,.tut,.cmdbox{background:var(--panel)!important;border:2px solid var(--frame)!important;border-radius:3px!important;clip-path:none!important;box-shadow:none}
.card.mine,.mem.mine{border-color:var(--accent)!important;box-shadow:inset 0 0 0 1px var(--accent)!important}
.card.tutc{border-color:var(--t3)!important}
.btn,.opt,.bmu,.bmt,.tab,.uchip,.stile,.bmf,.ctrl,.cycb,.chip{clip-path:none!important}
.btn{background:var(--btn)!important;color:var(--btnink)!important;border:2px solid var(--frame)!important;border-radius:3px!important}
.btn.ghost{background:transparent!important;color:var(--ink)!important;border:2px solid var(--frame)!important}
.btn:disabled{opacity:.4}
.opt,.tab{background:var(--road)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;border-radius:3px!important}
.opt[aria-pressed="true"],.tab[aria-pressed="true"]{background:var(--accent)!important;color:var(--accink)!important;border-color:var(--accent)!important;font-weight:700}
.bmt{background:var(--accent)!important;color:var(--accink)!important;border:2px solid var(--frame)!important;border-radius:2px!important}
.bmt small{color:#0A4A42!important}.bmt b{color:var(--accink)!important}
.bmt .cyc,.bmt button{color:var(--accink)}
.bmt.on{box-shadow:inset 0 0 0 2px #FFFFFF!important}
.bmu{background:var(--road)!important;border:1.5px solid var(--line)!important;border-left:5px solid var(--c)!important;border-radius:3px!important;color:var(--ink)}
.bmu.on{border-color:var(--frame)!important;border-left-color:var(--c)!important;box-shadow:inset 0 0 0 1px var(--frame)!important}
.bm-top{background:#06161D!important;border-bottom:2px solid var(--frame)!important}
.bm-dock{background:var(--panel)!important;border-top:2px solid var(--frame)!important}
.tslot select,input,select,textarea{background:var(--road);color:var(--ink);border-color:var(--line)}
.tslot select{border:1.5px solid var(--frame)!important;border-radius:3px!important}
.top h2::before,.card h2::before{background:var(--accent)!important}
.home h1,.top h2{color:var(--ink)}
.home h1.ttl::after{color:var(--frame)!important}
.stand td{border-top-color:var(--line)!important}
.stand tr.me td,.rkl li.me{background:color-mix(in srgb,var(--accent) 14%,transparent)!important}
#toast,.toast{background:var(--btn)!important;color:#fff!important;border:2px solid var(--frame)}
.pos{border-color:var(--frame)!important;color:var(--ink)}
.pos.ace,.pos.master,.pos.acls{color:#fff!important}
.chip{border-radius:2px!important}
.bm-op p{background:rgba(6,22,29,.88)!important;color:#C9FFF6!important;border-left-color:var(--accent)!important}
.tierh.t1 td{color:var(--frame)!important}
.uw .tok{outline-color:rgba(236,250,248,.9)}
.bmt .cycb{background:rgba(255,255,255,.55)!important;color:var(--accink)!important;border:1.5px solid var(--accink)!important;border-radius:2px!important}
.cycb{background:var(--road)!important;color:var(--ink)!important;border-color:var(--frame)!important}

/* v4.1 battle map area keeps the earlier palette */
.bm-view{--bg:#E8EBE6;--panel:#F5F6F3;--ink:#1C232D;--muted:#5B6470;--line:#C5CBC3;--road:#F1F2EE;--bld:#3B4656;--b1:#C3C9D0;--b2:#9AA4B1;--b3:#6E7A89;--b4:#465264;--hnc:#2B333D;--river:#A7C9DB;--high:#DACDAA;--reach:rgba(236,182,30,.5);--btn:#1C232D;--btnink:#F5F6F3;--t0:#2A64C6;--t1:#C93D31;--t2:#22845A;--t3:#A8770C;--grid:#C5CBC3;color:var(--ink);background:var(--line)}

:root[data-theme="dark"] .bm-view{--bg:#10151C;--panel:#18202A;--ink:#E5E8EC;--muted:#96A0AC;--line:#2D3745;--road:#1C2430;--bld:#4A576B;--b1:#2E3846;--b2:#3D4A5C;--b3:#506078;--b4:#687C99;--hnc:#C9D1DB;--river:#22465B;--high:#4B4330;--reach:rgba(236,182,30,.35);--btn:#E5E8EC;--btnink:#10151C;--t0:#5A90EC;--t1:#E65E50;--t2:#3DB27F;--t3:#D9A532;--grid:#2D3745;}
.bm-view .tut{border:1.5px solid var(--t0)!important;border-top:3px solid var(--t0)!important;background:var(--panel)!important}
.bm-view .bmf{background:var(--panel)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important}
.rules h4.rh{margin:12px 0 4px;font-size:14px;color:var(--accent,var(--t0));letter-spacing:.06em}
.rules ul{margin:0 0 4px;padding-left:1.2em}
.sefx{color:#C9A227;font-weight:700}
.crow.rtr{border-top:1px dashed var(--line);padding-top:4px}
.crow.rtr .opt{padding:5px 9px;font-size:12.5px}
.chip.ptimer{--c:#0D5B60;color:#fff;font-family:"Roboto Condensed",sans-serif;font-weight:700}
.chip.ptimer.low{--c:#C93D31;animation:ptb 1s steps(2) infinite}
@keyframes ptb{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.chip.ptimer.low{animation:none}}
.dexc{padding:12px 14px}
.dexn{font-size:17px}
.dexrows{display:grid;grid-template-columns:auto 1fr;gap:0;margin-top:8px}
.dexrows>div{display:contents}
.dexrows span{font-size:12.5px;color:var(--muted);padding:5px 10px 5px 0;border-top:1px dashed var(--line);white-space:nowrap}
.dexrows b{font-weight:500;font-size:13.5px;padding:5px 0;border-top:1px dashed var(--line)}
.dexrows b b{font-weight:800;font-size:16px;font-family:"Roboto Condensed","Noto Sans JP",sans-serif}
.c.rb{background:var(--road);background-image:radial-gradient(circle at 25% 30%,var(--b2) 0 12%,transparent 13%),radial-gradient(circle at 70% 60%,var(--b3) 0 10%,transparent 11%),radial-gradient(circle at 40% 80%,var(--b1) 0 9%,transparent 10%)}
.fx-dust{fill:var(--b2);opacity:0;animation:fxdust .9s ease-out both}
@keyframes fxdust{0%{opacity:.6;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
.fx-dust{transform-box:fill-box;transform-origin:center}
.bmu.rpu{min-width:0}.bmu.rpu.out{opacity:.45}
.rpctl input[type=range]{accent-color:var(--accent,#19F5C1)}
.rpctl .opt{padding:6px 10px}
.rpmode .bm-joyw{display:none}
.rpmode .bm-units{display:block!important;overflow:visible}
.rpteams{display:flex;flex-direction:column;gap:3px;width:100%}
.rpteam{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border-left:4px solid var(--c);padding:2px 6px;background:var(--road)}
.rptn{font-size:12px;font-weight:700;min-width:6.5em;display:flex;align-items:center;gap:4px}
.rptn b{font-family:"Roboto Condensed",sans-serif}
.rpu{display:inline-flex;flex-direction:column;gap:2px;min-width:3.6em}
.rpu em{font-style:normal;font-size:11px;line-height:1.1}
.rpu i{display:block;height:4px;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden}
.rpu i u{display:block;height:100%}
.rpu.out{opacity:.4}
.spec{padding:6px 8px;border:1.5px dashed var(--line);width:100%}
.prof .profname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof .profname>b{font-size:21px}
.profh{margin:14px 0 6px;font-size:14px;letter-spacing:.12em;color:var(--frame,var(--t0));font-family:"Roboto Condensed","Noto Sans JP",sans-serif;border-bottom:1.5px solid var(--line);padding-bottom:4px}
.tset{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tset h5{margin:0 0 4px;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.tslot2{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--accent,#19F5C1);color:var(--accink,#04241F);border-radius:3px;padding:7px 9px;margin:0 0 5px;min-height:34px}
.tslot2 b{font-size:14px}.tslot2 small{font-size:10.5px;opacity:.75}
.tslot2.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.memrow{display:flex!important;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.memrow .mtx{flex:1;min-width:0;line-height:1.5}
.memrow .mgo{font-size:26px;color:var(--muted)}
.cmdpanel{border:1.5px dashed var(--frame,var(--t0));padding:6px 8px;margin:0 0 6px;width:100%}

/* v6.4 landscape phones */
@media (orientation:landscape) and (max-height:560px){
 .bm{grid-template-columns:1fr minmax(270px,36%);grid-template-rows:auto 1fr}
 .bm-top{grid-column:1/3;padding:3px 8px;gap:4px}
 .bm-top .opt,.bm-top .chip{padding-top:3px;padding-bottom:3px}
 .bm-view{grid-row:2;grid-column:1}
 .bm-dock{grid-row:2;grid-column:2;align-content:start;border-top:0!important;border-left:2px solid var(--frame,var(--line));overflow:auto;padding:6px 8px;gap:5px}
 .bm-units{flex-wrap:wrap}
 .bmu{flex:1 1 30%;padding:4px 6px}
 .bm-row{grid-template-columns:1fr auto;align-items:start}
 .joy{width:84px;height:84px}
 .bm-mini{width:66px;height:66px}
 .bm-sheet{left:auto;width:min(420px,60%);max-height:100%;top:0;border-radius:16px 0 0 16px}
 .tutw{right:80px}
 .bm-op{max-width:55%}
 .home,.top,.card{max-width:760px}
 .bmtiles{grid-template-columns:1fr}
 .bmt{padding:4px 6px}
 .bmact{position:sticky;bottom:0;z-index:3;background:var(--panel);padding:4px 0 2px;box-shadow:0 -10px 10px -6px var(--panel)}
}

function rollStat(k){
  const d=STATDEF[k],ws=[];
  for(let v=d.min;v<=d.max;v++)ws.push([v,Math.pow(0.5,Math.abs(v-d.base))]);
  let r=Math.random()*ws.reduce((s,w)=>s+w[1],0);

}

    if(hp<=0.01){v[fk]=0;v[bk]=stampOf(S)+4;brk=1;}else v[fk]=hp/mx;
  }

}
function estBody(S,v,f,a){

  if(smartOn(S,team,'focus')&&tac!=='focus'&&seenE.length&&!(S.focus&&S.focus[team]&&S.focus[team].until>=S.turn.round*100)){const idE=seenE.filter(e=>det[e.id]==='id');const pool=idE.length?idE:seenE;const w=pool.slice().sort((a,b)=>(a.hp/a.hpMax+(a.leak?-0.1:0))-(b.hp/b.hpMax+(b.leak?-0.1:0)))[0];S.focus=S.focus||{};S.focus[team]={id:w.id,until:S.turn.round*100+12};}
  const snipeZ=smartOn(S,team,'snipe')?S.units.filter(e=>!e.out&&e.team!==team&&analyzed(S,team,e.id)&&[...e.main,...e.sub].some(k=>TR[k]&&TR[k].type==='snipe')).map(e=>{const pos=(det[e.id]==='id'||det[e.id]==='seen')?e:(S.teams[team].mem||{})[e.id];if(!pos)return null;const k=[...e.main,...e.sub].find(k=>TR[k]&&TR[k].type==='snipe');return {x:pos.x,y:pos.y,r:TR[k].rmax+hAt(S,pos.x,pos.y)};}).filter(Boolean):[];
  const watched=(x,y)=>seenE.some(e=>dist({x,y},e)<=sightOf(S,e)&&canSee(S,e,{x,y}));
  const placed=[];
  for(const u of mine.slice().sort((a,b)=>a===leader?-1:b===leader?1:0)){
    const tac=unitTac(S,u);
    const ak=attacksOf(u),sk=ak.find(k=>TR[k].still);
    const melee=ak.length>0&&ak.every(k=>TR[k].type==='melee');
    if(smartOn(S,team,'grass')&&u.hp<u.hpMax*0.4){const gi=u.sub.indexOf('grass');if(gi>=0&&seenE.some(e=>dist(u,e)<=1&&attacksOf(e).some(k=>TR[k].type==='melee'))){u.sa=gi;}}
    const lowTri=smartOn(S,team,'lowtri')&&u.triMax&&u.tri<u.triMax*0.25;
    const uo=uoOf(S,u);
    const opts=[{x:u.x,y:u.y,path:[]}];
    if(!(uo&&uo.type==='hold'))reachPaths(S,u).forEach((p,k)=>{const [x,y]=k.split(',').map(Number);opts.push({x,y,path:p});});
    const ox=u.x,oy=u.y;let best=null;
    const uoTgt=uo&&(uo.type==='target'||uo.type==='follow')?uById(S,uo.id):null;
    const pw={},rmc={},dB={};for(const k of ak)pw[k]=powOf(u,k);for(const e of known)dB[e.id]=defBase(e)/2;
    const anchor=tac==='escort'&&u!==leader?leader:(tac==='sniper'||tac==='artillery')&&!sk&&!heavy.includes(u)?(tac==='sniper'?snipers:heavy).filter(x=>x!==u).sort((a,b)=>dist(u,a)-dist(u,b))[0]:null;
    for(const o of opts){
      if(taken.has(keyOf(o.x,o.y)))continue;
      u.x=o.x;u.y=o.y;let s=Math.random()*0.5,pot=0;
      const h0=hAt(S,u.x,u.y),seeC={};
      for(const k of ak){
        if(TR[k].still&&o.path.length)continue;
        const rk=k+':'+h0,r=rmc[rk]!==undefined?rmc[rk]:(rmc[rk]=rmaxOf(S,u,k));

          if(edist(u,e.x,e.y)>r+0.25)continue;
          if(TR[k].type==='melee'&&Math.abs(h0-hAt(S,e.x,e.y))>1)continue;
          if(TR[k].los!==false){if(det[e.id]==='blip')continue;const cv=seeC[e.id]!==undefined?seeC[e.id]:(seeC[e.id]=canSee(S,u,e));if(!cv)continue;}
          pot=Math.max(pot,Math.max(1,pw[k]-dB[e.id]));
        }
      }
      s+=pot*(tac==='rush'||tac==='mobile'?2.6:2);
      if(u.se==='chimyaku')s+=h0*1.5;
      if(known.length){
        const dn=Math.min(...known.map(e=>dist(u,e)));
        if(sk){const keep=tac==='sniper'||tac==='artillery'?8:6;s-=Math.max(0,keep-dn)*3;s+=h0*(tac==='sniper'||tac==='artillery'?4:2);}
        else if(melee){
          if(tac==='rush')s-=dn*3;
          else if(tac==='mobile')s-=Math.abs(dn-(pot>0?1:2))*2.6;
          else if(tac==='turtle')s-=Math.abs(dn-3)*1.5;
          else if(tac==='stealth')s-=dn*1.6;
          else s-=dn*2;
        }else{
          const want=tac==='artillery'?8:tac==='disrupt'?5.5:tac==='turtle'?6:tac==='rush'?2:tac==='mobile'?3:4;
          s-=Math.abs(dn-want)*1.5;
          if(tac==='artillery')s+=h0*2.5;
        }
        if(tac==='stealth'&&!(melee&&pot>0)&&watched(u.x,u.y))s-=6;

      if(anchor)s-=Math.max(0,dist(u,anchor)-3)*2.5;
      if(uo){if(uo.type==='pos')s-=dist(u,uo)*3.5;else if(uo.type==='follow'&&uoTgt)s-=Math.max(0,dist(u,uoTgt)-2)*3.5;else if(uo.type==='target'&&uoTgt){const dd=dist(u,uoTgt);s-=melee?dd*3:Math.abs(dd-4)*2;}}
      if(tac==='turtle'||tac==='focus'){const others=placed.length?placed:mine.filter(x=>x!==u);if(others.length)s-=Math.min(...others.map(x=>dist(u,x)))>4?(Math.min(...others.map(x=>dist(u,x)))-4)*(tac==='turtle'?2:0.8):0;}
      if(smartOn(S,team,'outnum')&&!melee){const en=seenE.filter(e=>dist(u,e)<=5).length,al=mine.filter(m=>m!==u&&dist(u,m)<=5).length+1;if(en>al)s-=(en-al)*2.5;}

      if(u.hp<u.hpMax*fear||lowTri)s-=seenE.filter(e=>dist(u,e)<=3).length*4;
      if(!best||s>best.s)best={...o,s};
    }
    u.x=ox;u.y=oy;taken.add(keyOf(best.x,best.y));placed.push({x:best.x,y:best.y});
    const far=known.length?Math.min(...known.map(e=>dist({x:best.x,y:best.y},e))):99;
    orders[u.id]={path:encPath(best.path),mode:(tac==='rush'||tac==='mobile'||tac==='stealth')&&melee&&far>2?'move':'attack'};
  }
  return orders;
}

function applyAllCtrl(){

}
function hostTick(force){
  if(!isHost()||!G||G.status!=='play')return;
  if(G.phase==='plan'){
    const r=G.turn.round,alive=aliveTeams(G);
    const need=G.teams.map((t,i)=>i).filter(i=>alive[i]&&!G.teams[i].cpu);
    if(!force&&!need.every(i=>ORD['t'+i]&&ORD['t'+i].round===r))return;
    const orders={};
    G.teams.forEach((t,i)=>{
      if(!alive[i])return;
      if(t.cpu)cpuOperator(G,i);
      let o=t.cpu?cpuPlan(G,i):(ORD['t'+i]&&ORD['t'+i].round===r?ORD['t'+i].orders||{}:{});
      if(!t.cpu&&t.pc){const cp=cpuPlan(G,i);delete cp[t.pc];const mine=o[t.pc];o=cp;if(mine)o[t.pc]=mine;}
      for(const id in o){const u=uById(G,id);if(u&&u.team===i)orders[id]=o[id];}
    });
    applyAllCtrl();startExec(G,orders);aimAll(G);
    G.seq=(G.seq||0)+1;pushGame();onlineChanged();

  }
  if(G.phase==='exec'&&!execTimer&&!G.pause){

      applyAllCtrl();aimAll(G);

    },TICK_ONLINE);

}

function setCtrl(u,patch){

function contactSet(){

}
function canCtrl(u){

}
const canPath=u=>!!u&&G.phase==='plan'&&!!PLAN&&!PLAN.submitted&&u.team===PLAN.team&&!u.out&&(!G.teams[u.team].pc||u.id===G.teams[u.team].pc);

function defaultOrders(S,team){const o={};S.units.filter(u=>!u.out&&u.team===team).forEach(u=>{o[u.id]={path:[],mode:'attack'};});return o;}
const humanTeams=S=>S.teams.map((t,i)=>t.cpu?-1:i).filter(i=>i>=0);
function startRoundLocal(){
  if(G&&G.rec&&G.turn.round>1)recFrame(G);
  if(G&&G.def&&G.def.lastWave&&G.def.lastWave.r===G.turn.round&&!G.def.lastWave.shown){G.def.lastWave.shown=1;setTimeout(()=>{sfx('alert');toast(`第${G.def.lastWave.i}波：トリオン兵が${G.def.lastWave.n}体出現！`);},400);}
  const alive=aliveTeams(G);
  LOCAL={humans:humanTeams(G).filter(i=>{if(!alive[i])return false;const t=G.teams[i],pu=t.pc&&uById(G,t.pc);if(pu&&pu.out&&!pcIsCmdr(G,i))return false;return true;}),idx:0,orders:{}};
  if(!LOCAL.humans.length){PLAN=null;const s=session;setTimeout(()=>{if(s===session)resolveLocal();},400);render();return;}
  beginPlan();
}
function beginPlan(){
  const t=LOCAL.humans[LOCAL.idx];
  {const tm=G.teams[t];if(tm.pc&&cmdrOf(G,t)&&cmdrOf(G,t).id!==tm.pc){const ty=npcCaptainOrder(G,t);npcCaptainPersonal(G,t);if(ty){const o=tm.order;sfx('radio');toast(`隊長の指示：${ORDERS[ty].n}${ty==='focus'&&o.target?`（${uById(G,o.target).name}）`:''}`);}}}
  PLAN={team:t,round:G.turn.round,orders:defaultOrders(G,t)};
  ui.planEnd=OPTS.planSec&&!G.tut?Date.now()+OPTS.planSec*1000:null;ui.lastBeep=null;
  ui.sel=null;ui.insp=null;ui.aim=null;
  {const pc=G.teams[t].pc,pu=pc&&uById(G,pc);if(pu&&!pu.out){ui.sel=pc;ui.center=true;}}

function submitLocal(){

function resolveLocal(){
  const alive=aliveTeams(G);
  G.teams.forEach((t,i)=>{if(t.dummy)return;if(t.cpu&&alive[i]){cpuOperator(G,i);Object.assign(LOCAL.orders,cpuPlan(G,i));}else if(t.pc&&alive[i]){const o=cpuPlan(G,i);delete o[t.pc];Object.assign(LOCAL.orders,o);}});
  startExec(G,LOCAL.orders);aimAll(G);SEENSET=contactSet();
  {const pt=G.teams.find(t=>t.pc);if(pt){const pu=uById(G,pt.pc);ui.pcStart=pu?{x:pu.x,y:pu.y}:null;ui.pcAtk=0;ui.pcAtkT=0;ui.pcAtkU=0;}}
  PLAN=null;ui.sel=null;ui.aim=null;ui.phase=null;ui.paused=false;
  if(humanTeams(G).length===1)ui.sel=null;
  render();
}
function scheduleLocal(){
  if(lTimer||ui.paused||SPEED==='step'||MODE!=='local'||!G||G.status!=='play'||G.phase!=='exec')return;
  const s=session;ui.tickAt=Date.now();
  lTimer=setTimeout(()=>{
    lTimer=null;

function judgeOrder(){
  const ti=G.teams.findIndex(t=>t.pc);if(ti<0)return;
  const t=G.teams[ti],o=orderActive(G,ti),pu=uById(G,t.pc);if(!o||!pu||pu.out||o.judged===G.turn.round)return;
  const L=cmdrOf(G,ti);if(L&&L.id===t.pc)return;
  o.judged=G.turn.round;
  let ok=false;
  const po=t.uo&&t.uo[t.pc];
  if(po&&po.cap&&po.type==='target')ok=(ui.pcAtkU||0)>0;
  else if(po&&po.cap&&po.type==='follow'){const x=uById(G,po.id);ok=x&&dist(pu,x)<=3;}
  else if(o.type==='rush')ok=ui.pcAtk>0;
  else if(o.type==='focus')ok=ui.pcAtkT>0;
  else if(o.type==='gather')ok=L&&dist(pu,L)<=3;
  else if(o.type==='hide')ok=bagOn(pu)&&!pu.rev;
  else if(o.type==='hold')ok=ui.pcStart&&dist(pu,ui.pcStart)<=2;
  if(ok){t.morale=G.turn.round+1;G.cmdExp=(G.cmdExp||0)+1;toast(`指示「${ORDERS[o.type].n}」を達成！ 次のラウンドは部隊の命中+5`);}
}
function localStep(){
    aimAll(G);ui.fxAt=Date.now();
    const done=stepExec(G);if(G.rec)recFrame(G);playEvents(G,viewTeam());opReport(G,viewTeam());
    if(myWiped()&&!G.wipeNote){G.wipeNote=1;setTimeout(()=>{sfx('lose');toast('部隊が全滅しました。ここからは全員が見える観戦モードです');},300);}
    if(done){judgeOrder();endExec(G);if(G.status==='play'){startRoundLocal();return;}}
    else{
      {const pt=G.teams.find(t=>t.pc);if(pt){for(const e of G.lastEv){if(e.a===pt.pc&&!e.bleed){ui.pcAtk=(ui.pcAtk||0)+1;const o=pt.order;if(o&&o.target===e.v)ui.pcAtkT=(ui.pcAtkT||0)+1;const po=pt.uo&&pt.uo[pt.pc];if(po&&po.type==='target'&&po.id===e.v)ui.pcAtkU=(ui.pcAtkU||0)+1;}}}}
      aimAll(G);
      const now=contactSet(),fresh=[...now].filter(id=>!SEENSET||!SEENSET.has(id));
      SEENSET=now;
      if(AUTOPAUSE&&fresh.length&&humanTeams(G).length&&SPEED!=='step'){ui.paused=true;sfx('alert');toast(`接敵！ 一時停止中（${fresh.length}人）`);}
    }
    render();
}

const HEXAX=[['T','トリオン',12],['ATK','攻撃',16],['DS','防御・援護',9],['TEC','技術',9],['EVA','回避',9],['CMD','指揮',9]];
function hexSVG(m,color,labels){
  const v={T:m.T,ATK:atkOf(m),DS:Math.round((Math.min(9,defBase(m))+m.SUP)/2),TEC:m.TEC,EVA:m.EVA,CMD:m.CMD||4},R=60;
  const P=(i,f)=>{const a=(-90+i*60)*Math.PI/180;return [(Math.cos(a)*R*f).toFixed(1),(Math.sin(a)*R*f).toFixed(1)];};
  let s='';
  for(const f of [1/3,2/3,1])s+=`<polygon points="${HEXAX.map((_,i)=>P(i,f).join(',')).join(' ')}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  HEXAX.forEach((_,i)=>{const p=P(i,1);s+=`<line x1="0" y1="0" x2="${p[0]}" y2="${p[1]}" stroke="var(--grid)" stroke-width="1"/>`;});
  s+=`<polygon points="${HEXAX.map(([k,,mx],i)=>P(i,Math.max(0.06,Math.min(1,v[k]/mx))).join(',')).join(' ')}" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  if(labels)HEXAX.forEach(([k,n],i)=>{
    const a=(-90+i*60)*Math.PI/180,x=Math.cos(a)*(R+16),y=Math.sin(a)*(R+16);
    const anc=Math.abs(x)<5?'middle':x>0?'start':'end',dy=y<-30?-4:y>30?12:4;
    s+=`<text class="lab" x="${x.toFixed(1)}" y="${(y+dy-12).toFixed(1)}" text-anchor="${anc}">${n}</text><text class="val" x="${x.toFixed(1)}" y="${(y+dy+2).toFixed(1)}" text-anchor="${anc}">${v[k]}</text>`;
  });
  const vb=labels?'-118 -100 236 200':'-66 -66 132 132';
  return `<svg class="hex" viewBox="${vb}" role="img" aria-label="${HEXAX.map(([k,n])=>n+v[k]).join('、')}">${s}</svg>`;
}

function evTicker(S,vt){

  const rows=[];

    const vis=evVis(S,vt,e);if(!vis)continue;
    const {a,v,seeA}=vis;
    if(e.tri){rows.push(`<li class="${vt>=0&&v.team===vt?'hurt':''}" style="--c:${tc(v.team)}"><b>${esc(v.name)}</b> ${e.leak?'トリオン漏出':'トリオン切れ'} <em>緊急脱出</em></li>`);continue;}
    if(e.bleed){rows.push(`<li class="${vt>=0&&v.team===vt?'hurt':''}" style="--c:${tc(v.team)}"><b>${esc(v.name)}</b> トリオン漏出 −1${e.ko?' <em>緊急脱出</em>':''}</li>`);continue;}
    const an=seeA?esc(a.name):'見えない敵',vn=esc(v.name);
    const res=e.hit?(e.lead?'重り':e.dmg===0&&e.blk?`シールドで防いだ${e.brk?'（破壊）':''}`:`${e.dmg}ダメージ${e.crit?'（会心）':''}${e.blk?`（${e.blk}防いだ${e.brk?'・シールド破壊':''}）`:''}`):'回避';
    const cls=vt>=0&&v.team===vt?'hurt':vt>=0&&a.team===vt?'mine':'';
    rows.push(`<li class="${cls}" style="--c:${tc(a.team)}"><b>${an}</b>→<b>${vn}</b> ${res}${e.ko?' <em>緊急脱出</em>':''}</li>`);

const SEI=['相沢','青木','秋山','石井','市川','上田','内田','大野','岡本','小川','加藤','川口','木村','工藤','小島','後藤','坂本','清水','杉本','高木','竹内','田村','中川','中島','西村','野口','橋本','服部','原田','平野','福田','藤井','前田','松本','森田','矢野','山口','吉田','渡辺','桑原','松岡','新田'];
const MEI=['葵','新','伊吹','詠美','恵太','和真','奏多','郁','慶','健吾','耕平','咲良','智也','純','翔太','司','直人','七海','颯真','陽菜','真央','未来','悠','佑真','莉子','亮','蓮司','若菜','千尋','大輝'];
let PC=null,PCD=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pcLoad(){try{PC=JSON.parse(localStorage.getItem('rt-pc')||'null');}catch(e){PC=null;}if(PC&&PC.CMD==null){PC.CMD=rollStat('CMD');pcSave();}if(PC&&!PC.cls)PC.cls='B';}

const pcName=p=>`${p.sei} ${p.mei}`;
function pcMember(p){const g=growthOf(Math.max(p.maxPts||4000,p.pts==null?4000:p.pts));const C=p.cls==='C';const first=p.main.find(k=>isAtk(k))||p.main[0];return {name:pcName(p),main:C?[first,'none','none','none']:p.main.slice(),sub:C?['none','none','none','none']:p.sub.slice(),T:p.T,TEC:Math.min(9,p.TEC+g.TEC),SUP:p.SUP,EVA:Math.min(9,p.EVA+g.EVA),MOB:p.MOB,CMD:Math.min(9,(p.CMD||4)+(p.cmdUp||0)),sk:(p.skills||[]).slice(),se:p.se||undefined};}
function newPC(){const pr=PRESETS[0][0];return rollInto({se:rollSE(0.1),sei:pick(SEI),mei:pick(MEI),cls:'B',main:pr[0].slice(),sub:pr[1].slice(),rerolls:REROLLS,rec:{matches:0,kills:0,downs:0},pts:4000,maxPts:4000,skills:[],cmdExp:0,cmdUp:0,created:Date.now()});}
function freeAgent(){const p=pick(PRESETS)[Math.floor(Math.random()*3)];const m=rollInto({name:`${pick(SEI)} ${pick(MEI)}`.slice(0,7),main:p[0].slice(),sub:p[1].slice()});m.se=rollSE(0.15)||undefined;m.sk=autoSkills(m,npcPts(m));return {...withGrowth(m,npcPts(m)),grown:1};}

/* ===== teammate growth ===== */
const MATE_GAIN={rank:{base:40,kill:60,surv:40,top:40},def:{base:20,kill:30,surv:20,top:30}};
function mateInit(m){
  if(m.pts!=null&&m.bTEC!=null)return m;
  if(!m.grown){const p=npcPts(m),g=growthOf(p);m.bTEC=m.TEC;m.bEVA=m.EVA;m.pts=p;m.TEC=Math.min(9,m.bTEC+g.TEC);m.EVA=Math.min(9,m.bEVA+g.EVA);m.grown=1;if(!(m.sk&&m.sk.length))m.sk=autoSkills(m,p);}
  else{const p=m.pts!=null?m.pts:npcPts(m),g=growthOf(p);m.pts=p;m.bTEC=Math.max(1,m.TEC-g.TEC);m.bEVA=Math.max(1,m.EVA-g.EVA);if(!(m.sk&&m.sk.length))m.sk=autoSkills(m,p);}
  m.games=m.games||0;m.kills=m.kills||0;return m;
}
const mateNext=m=>{const p=m.pts||0;let best=null;for(const [q,k] of GROWTH)if(q>p&&(!best||q<best[0]))best=[q,k];const sq=4000+Math.max(0,Math.floor((p-4000)/500)+1)*500;return {grow:best,sp:sq};};
function mateGrow(list,kind){
  if(!pcInLeague()||!list||!list.length)return [];
  const T=LEAGUE.me.team,G0=MATE_GAIN[kind]||MATE_GAIN.rank,msgs=[];
  for(const e of list){
    if(e.mi===T.pcIdx)continue;const m=T.members[e.mi];if(!m)continue;mateInit(m);
    const gain=G0.base+e.kills*G0.kill+(e.out?0:G0.surv)+(e.top?G0.top:0);
    const old=m.pts,oldTEC=m.TEC,oldEVA=m.EVA,oldSk=(m.sk||[]).slice();
    m.pts=old+gain;m.games++;m.kills+=e.kills;
    const g=growthOf(m.pts);m.TEC=Math.min(9,m.bTEC+g.TEC);m.EVA=Math.min(9,m.bEVA+g.EVA);
    m.sk=autoSkills(m,m.pts);
    const ups=[];if(m.TEC>oldTEC)ups.push(`技術+${m.TEC-oldTEC}`);if(m.EVA>oldEVA)ups.push(`回避+${m.EVA-oldEVA}`);
    m.sk.filter(x=>!oldSk.includes(x)).forEach(x=>ups.push(`「${SKILLS[x].n}」を習得`));
    if(ups.length)msgs.push(`${m.name.split(' ')[0]}：${ups.join('・')}`);
    e.gain=gain;e.name=m.name;
  }
  if(msgs.length){LEAGUE.me.growLog=(LEAGUE.me.growLog||[]).concat(msgs.map(s=>({at:Date.now(),s}))).slice(-8);setTimeout(()=>{sfx('chime');toast('仲間が成長！ '+msgs.join('／'));},500);}
  lgSave();return msgs;
}
function mateListFrom(S,ti){const best=Math.max(...S.teams.map(t=>t.score));return S.units.filter(u=>u.team===ti).map(u=>({mi:+u.id.slice(2),kills:(S.kills||{})[u.id]||0,out:!!u.out,top:S.teams[ti].score===best&&best>0}));}

function pcRecord(res){if(res&&res.mates&&!res.matesDone){res.matesDone=1;mateGrow(res.mates,'rank');}if(!res||!res.pc)return;pcLoad();if(!PC)return;PC.rec=PC.rec||{matches:0,kills:0,downs:0};PC.rec.matches++;PC.rec.kills+=res.pc.kills;if(res.pc.out)PC.rec.downs++;pcSave();

let TRAINEES=null;
function trainees(){
  if(TRAINEES)return TRAINEES;
  let seed=12345;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  const pk=a=>a[Math.floor(rnd()*a.length)];
  TRAINEES=Array.from({length:30},(_,i)=>{
    const k=pk(TRAINEE_TRIG),pts=Math.round((1000+rnd()*2950)/10)*10;
    const st=b=>clamp(Math.round(b+(rnd()-0.6)*4),1,12);
    const m={name:`${pk(SEI)} ${pk(MEI)}`.slice(0,7),main:[k,'none','none','none'],sub:['none','none','none','none'],T:st(5),TEC:clamp(st(4),1,9),SUP:clamp(st(4),1,9),EVA:clamp(st(4),1,9),MOB:clamp(Math.round(9+(rnd()-0.5)*4),6,14),CMD:clamp(st(3),1,9),sk:[]};
    return {key:'c'+i,team:'C級',m,pts};
  });
  return TRAINEES;
}

function pcSP(){const max=Math.max(PC.maxPts||4000,pcPts());const spent=(PC.skills||[]).reduce((s,id)=>s+SKILLS[id].cost,0);return spOf(max)+(PC.bonusSP||0)-spent;}

function agents(){
  const list=[];
  NPC_TEAMS.forEach(t=>t.members.forEach((m,i)=>{const p=npcPts(m);list.push({key:t.id+':'+m.name,team:t.name,cls:'B',m:withCmd(withGrowth({...m,sk:autoSkills(m,p)},p),i===0),pts:p});}));

function tone(o){
  const c=SND.ctx,t=c.currentTime+(o.at||0),g=c.createGain(),osc=c.createOscillator();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f||440,t);if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||.1));

function playEvents(S,vt){

  let n=0;
  for(const e of S.lastEv||[]){
    if(n>=9)break;
    const vis=evVis(S,vt,e);if(!vis)continue;n++;

    const close=t==='melee'&&Math.hypot((e.ax||0)-(e.vx||0),(e.ay||0)-(e.vy||0))<=1.6;
    if(t==='melee')sfx(e.sen?'sweep':e.k==='scorpion'?'slash2':e.k==='raygust'?'heavy':'slash',{pan:pa});
    else if(t==='snipe')sfx(e.k==='ibis'?'ibis':e.k==='lightning'?'lightning':'snipe',{pan:pa});
    else if(t==='blast'){sfx('launch',{pan:pa});sfx('boom',{pan:pv,at:.4});}
    else if(e.lead)sfx('lead',{pan:pa});
    else sfx(e.k==='hound'||e.k2==='hound'?'hound':e.k==='viper'||e.k2==='viper'?'viper':e.k==='shotgun'?'shotgun':e.k==='rifle'?'rifle':'shot',{pan:pa});
    if(!seeV&&!(vt>=0&&v.team===vt))continue;
    const hd=(t==='snipe'?80:t==='blast'?420:close?120:300)/1000;
    if(e.hit){
      if(!e.lead&&e.dmg===0&&e.blk)sfx(e.brk?'brk':'block',{pan:pv,at:hd});
      else{sfx('hit',{pan:pv,at:hd});if(e.brk)sfx('brk',{pan:pv,at:hd});if(e.crit)sfx('crit',{pan:pv,at:hd+.03});}
    }else sfx('miss',{pan:pv,at:hd});

  }
}

  }
  return {app:'rwt',v:2,data};
}

const mf=n=>440*Math.pow(2,(n-69)/12);
const BGM_SONG={
  calm:{bpm:74,chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]},
  battle:{bpm:132,chords:[[57,60,64],[57,60,64],[53,57,60],[55,59,62]]}

function bgmEnsure(){
  if(!BGM.on)return false;sndInit();if(!SND.ctx)return false;
  if(!BGM.gain){BGM.gain=SND.ctx.createGain();BGM.gain.gain.value=0;BGM.gain.connect(SND.ctx.destination);}

}
function bNote(f,t,d,type,v,cut){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(0.4,d*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  if(cut){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);fl.connect(g);}else o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+d+0.05);}
function bHit(t,v){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.18);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+0.25);}
function bHat(t,v){const c=SND.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=SND.noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.connect(f);f.connect(g);g.connect(BGM.gain);s.start(t,Math.random()*.5);s.stop(t+0.06);}
function bgmStep(mode,step,t){
  const S=BGM_SONG[mode],sd=60/S.bpm/4,bar=Math.floor(step/16)%S.chords.length,ch=S.chords[bar],s=step%16;
  if(mode==='calm'){
    if(s===0)ch.forEach((n,i)=>{bNote(mf(n),t,sd*16*1.1,'triangle',0.05,1400);bNote(mf(n)*1.003,t,sd*16*1.1,'sawtooth',0.012,900);});
    if(s===0)bNote(mf(ch[0]-12),t,sd*16,'sine',0.07);
    if(s%4===2&&Math.random()<0.75)bNote(mf(ch[(s/2+bar)%3]+12),t,sd*3,'sine',0.035);
  }else{
    if(s%4===0)bHit(t,0.32);
    if(s%4===2)bHat(t,0.05);if(s%2===1)bHat(t,0.02);
    if(s%2===0)bNote(mf(ch[0]-24+(s%8===6?12:0)),t,sd*1.8,'square',0.05,600);
    bNote(mf(ch[[0,1,2,1][s%4]]+12),t,sd*0.9,'triangle',0.022,2500);
    if(s===0)ch.forEach(n=>bNote(mf(n),t,sd*16,'sawtooth',0.012,1100));
  }
}
function bgmTick(){
  if(!SND.ctx||!BGM.gain)return;
  if(BGM.want!==BGM.mode){
    const c=SND.ctx,now=c.currentTime;BGM.gain.gain.cancelScheduledValues(now);BGM.gain.gain.setValueAtTime(BGM.gain.gain.value,now);BGM.gain.gain.linearRampToValueAtTime(0,now+0.6);
    BGM.mode='switch';setTimeout(()=>{BGM.mode=BGM.want;BGM.step=0;BGM.next=SND.ctx.currentTime+0.05;if(BGM.mode){const n=SND.ctx.currentTime;BGM.gain.gain.cancelScheduledValues(n);BGM.gain.gain.setValueAtTime(0,n);BGM.gain.gain.linearRampToValueAtTime(BGM.vol*(BGM.mode==='battle'?0.9:1),n+1.2);}},650);
    return;
  }
  if(!BGM.mode||BGM.mode==='switch'||document.hidden)return;
  const c=SND.ctx,sd=60/BGM_SONG[BGM.mode].bpm/4;
  if(BGM.next<c.currentTime)BGM.next=c.currentTime+0.05;
  while(BGM.next<c.currentTime+0.15){try{bgmStep(BGM.mode,BGM.step,BGM.next);}catch(e){}BGM.next+=sd;BGM.step++;}
}
function bgmSet(mode){
  if(!BGM.on)mode=null;

function planLeft(){

function pauseLeft(team){if(!G||!G.bank)return 0;let b=G.bank[team]||0;if(G.pause&&G.pause.team===team)b-=Math.max(0,nowHost()-G.pause.since);return Math.max(0,b/1000);}
function timerTick(){
  if(!G||G.status!=='play')return;
  const left=planLeft();
  if(left!=null){

    if(el){el.textContent='残り '+fmtSec(left);el.classList.toggle('low',left<=30);}
    const s=Math.ceil(left);if(s!==ui.lastBeep&&(s===30||s===10||(s<=5&&s>0))){ui.lastBeep=s;sfx(s<=5?'click':'alert');}

      if(MODE==='online'&&PLAN&&!PLAN.submitted&&myTeam()>=0){toast('時間切れ：今の作戦で決定しました');submitOnline();}
      if(MODE==='online'&&isHost()&&left<=-3)hostTick(true);

    if(isHost()&&G.pause&&pauseLeft(G.pause.team)<=0){const t=G.pause.team;G.bank[t]=0;G.pause=null;G.seq=(G.seq||0)+1;pushGame();toast(`${G.teams[t].name}の持ち時間が尽きたので再開します`);onlineChanged();}

}

const REPLAY_MAX=8,REP_STATIC=['name','team','T','TEC','SUP','EVA','MOB','CMD','main','sub','se','sk','hpMax','triMax','ts'];
const REP_DYN=['x','y','hp','tri','out','md','mr','sd','sr','mw','sw','ma','sa','fa','bag','rev','leak'];
function recStart(S,meta){S.rec={meta,st:{},fr:[],thV:-1,wk:'',wmN:-1,dk:''};recFrame(S);}
function recFrame(S){
  const R=S.rec;if(!R||R.fr.length>600)return;
  for(const u of S.units)if(!R.st[u.id]){const o={};REP_STATIC.forEach(k=>{if(u[k]!==undefined)o[k]=Array.isArray(u[k])?u[k].slice():u[k];});R.st[u.id]=o;}
  const f={r:S.turn.round,ph:S.phase==='exec'?1:0,t:S.exec?S.exec.tick:0,mt:S.exec?S.exec.maxT:0,sc:S.teams.map(t=>t.score),
    u:S.units.map(u=>[u.id,...REP_DYN.map(k=>{const v=u[k];return typeof v==='boolean'?(v?1:0):typeof v==='number'?Math.round(v*10)/10:(v==null?0:v);})])};
  if(S.lastEv&&S.lastEv.length&&S.phase==='exec')f.ev=JSON.parse(JSON.stringify(S.lastEv));
  if((S.thV||0)!==R.thV){R.thV=S.thV||0;f.th=Object.assign({},S.th||{});}
  const wk=JSON.stringify(S.walls||{});if(wk!==R.wk){R.wk=wk;f.wl=JSON.parse(wk);}
  const wmN=Object.keys(S.wm||{}).length;if(wmN!==R.wmN){R.wmN=wmN;f.wm=Object.assign({},S.wm||{});}
  const dk=JSON.stringify(S.decoys||[]);if(dk!==R.dk){R.dk=dk;f.dc=JSON.parse(dk);}
  if(S.def)f.dw=[S.def.next,S.def.waves.length];
  R.fr.push(f);
}
function repLoad(){try{return JSON.parse(localStorage.getItem('rt-replays')||'[]');}catch(e){return [];}}
function repStore(list){
  while(list.length){try{localStorage.setItem('rt-replays',JSON.stringify(list));return true;}catch(e){list.shift();}}
  try{localStorage.removeItem('rt-replays');}catch(e){}return false;
}
function recSave(S){
  const R=S.rec;if(!R||R.saved||R.fr.length<2)return null;R.saved=true;recFrame(S);
  const rp={id:'rp'+Date.now()+Math.floor(Math.random()*1000),at:Date.now(),meta:R.meta,mapId:S.mapId,cond:S.cond,maxr:S.maxr||MAXR,
    teams:S.teams.map(t=>({name:t.name,score:t.score})),st:R.st,fr:R.fr,def:S.def?{n:DEF_LV[S.def.lv].n,result:S.def.result}:null};
  const list=repLoad();list.push(rp);while(list.length>REPLAY_MAX)list.shift();repStore(list);
  return rp.id;
}
let RP=null;
function repBuild(i){
  const R=RP.rec,f=R.fr[i];let th={},wl={},wm={},dc=[],dw=null;
  for(let k=0;k<=i;k++){const x=R.fr[k];if(x.th)th=x.th;if(x.wl)wl=x.wl;if(x.wm)wm=x.wm;if(x.dc)dc=x.dc;if(x.dw)dw=x.dw;}
  const units=f.u.map(a=>{const st=R.st[a[0]]||{};const u={id:a[0],...JSON.parse(JSON.stringify(st))};REP_DYN.forEach((k,j)=>{u[k]=a[j+1];});u.out=!!u.out;u.bag=!!u.bag;u.rev=!!u.rev;return u;});
  const thN=Object.keys(th).length;
  G={v:4,replay:true,status:'play',phase:f.ph?'exec':'plan',mapId:R.mapId,cond:R.cond,maxr:R.maxr,turn:{round:f.r},
    teams:R.teams.map((t,i)=>({name:t.name,score:f.sc[i]||0,cpu:true,noOp:true,mem:{},tag:{},ana:{},cd:{}})),
    units,lastEv:f.ev||[],th,thN,thV:i===0?0:R.fr.slice(0,i+1).filter(x=>x.th).length,walls:wl,wm,decoys:dc,log:[],exec:f.ph?{tick:f.t,maxT:f.mt,st:{}}:null,tc:i};
  if(dw)G.def={next:dw[0],waves:{length:dw[1]}};
}

  else if(a==='rtclear'){const s=ui.sel&&uById(G,ui.sel);if(s&&PLAN){PLAN.orders[s.id].path=[];ui.segs=[];render();}}
  else if(a==='hostPlan'){if(G&&G.host===ME&&G.status==='lobby'){G.planSec=+v;G.seq=(G.seq||0)+1;pushGame();renderLobby();}}
  else if(a==='hostBank'){if(G&&G.host===ME&&G.status==='lobby'){G.pauseSec=+v;G.seq=(G.seq||0)+1;pushGame();renderLobby();}}
  else if(a==='onpause'){onlinePause(!(G.pause&&G.pause.team===myTeam()));}
  else if(a==='planlim'){const L=[0,120,180];OPTS.planSec=L[(L.indexOf(OPTS.planSec)+1)%L.length];optsSave();if(MODE==='local'&&G&&G.phase==='plan'&&PLAN&&!G.tut)ui.planEnd=OPTS.planSec?Date.now()+OPTS.planSec*1000:null;render();}
  else if(a==='hostMode'){if(G&&G.host===ME&&G.status==='lobby'){G.mode=v;G.seq=(G.seq||0)+1;pushGame();renderLobby();}}
  else if(a==='opscan'){ui.opMode=ui.opMode==='scan'?null:'scan';render();}
  else if(a==='oproute'){ui.opMode=ui.opMode==='route'?null:'route';render();}
  else if(a==='cmdpick'){ui.cmdUnit=ui.cmdUnit===v?null:v;ui.cmdMode=null;render();}
  else if(a==='cmdmode'){ui.cmdMode=ui.cmdMode===v?null:v;render();}
  else if(a==='cmdclose'){ui.cmdUnit=null;ui.cmdMode=null;render();}
  else if(a==='cmdfollow'||a==='cmdset'){const mu=uById(G,ui.cmdUnit);if(mu){if(v==='free'){issueUnitOrderN(G,mu.team,mu.id,{type:'free'});toast(`${mu.name}：自由に動きます`);}else{const ok=issueUnitOrderN(G,mu.team,mu.id,a==='cmdfollow'?{type:'follow',id:v}:{type:'hold'});G.cmdExp=Math.min(3,(G.cmdExp||0)+1);toast(ok==='sent'?`${mu.name}に指示を送りました`:ok?`${mu.name}：了解`:`${mu.name}は指示に従えなかった`);}sfx('radio');ui.cmdMode=null;if(G.phase==='exec')aimAll(G);render();}}
  else if(a==='sndtog'){SND.on=!SND.on;sndSave();if(SND.on){sndInit();if(SND.ctx)SND.ctx.resume();setTimeout(()=>sfx('chime'),50);}render();}
  else if(a==='bgmtog'){BGM.on=!BGM.on;sndSave();if(BGM.on){bgmEnsure();if(SND.ctx)SND.ctx.resume();bgmAuto();}else bgmSet(null);render();}
  else if(a==='bgmvol'){BGM.vol=BGM.vol>=0.5?0.18:BGM.vol>=0.3?0.55:0.35;sndSave();render();}
  else if(a==='sndvol'){SND.vol=SND.vol>=0.9?0.3:SND.vol>=0.55?1:0.6;sndSave();sfx('shot');render();}
  else if(a==='tutorial2'){startTutorial2();}
  else if(a==='tutnext'){if(TUT){const s=(TUT.steps||TUT_STEPS)[TUT.i];if(s&&s.last){TUT=null;goHome();toast('チュートリアル完了！');return;}TUT.i++;render();}}
  else if(a==='tutskip'){TUT=null;goHome();}
  else if(a==='tutorial'){startTutorial();}
  else if(a==='order'){const otm=sel&&canCtrl(sel)?sel.team:cmdTeam();if(otm>=0){const r=issueOrderN(G,otm,v);if(r.sent){sfx('radio');toast(`${ORDERS[v].n}を指示しました`);render();return;}G.cmdExp=Math.min(3,(G.cmdExp||0)+1);if(G.phase==='exec')aimAll(G);sfx('radio');toast(`${ORDERS[v].n}を指示（${r.n}/${r.tot}人が従う）`);render();}}
  else if(a==='fanmode'){FANMODE=FANMODE==='sel'?'all':'sel';render();}
  else if(a==='facyc'){if(sel&&canCtrl(sel)){const ms=atkModes(G,sel),i=ms.indexOf(sel.fa||0);setCtrl(sel,{fa:ms[(i+1)%ms.length]});toast(faLabel(G,sel));render();}}
  else if(a==='lead'){if(sel&&canCtrl(sel)){const f=v==='m'?'lm':'ls';setCtrl(sel,{[f]:!sel[f]});render();}}
  else if(a==='next'){if(MODE==='local'&&G&&G.phase==='exec')localStep();}
  else if(a==='autoall'){const own=G.units.filter(u=>!u.out&&canCtrl(u));const on=!own.some(u=>u.au);own.forEach(u=>setCtrl(u,{au:on,mu:0}));if(on)aimAll(G);render();}
  else if(a==='focus'){
    const tm=sel&&canCtrl(sel)?sel.team:(viewTeam()>=0?viewTeam():cmdTeam()>=0?cmdTeam():(G.units.find(u=>!u.out&&canCtrl(u))||{}).team);
    if(tm==null){toast('先に自分の隊員を選んでください');return;}
    setFocus(tm,v||null);
    {const t=G.teams[tm];if(v&&t&&t.pc&&pcIsCmdr(G,tm)){const r=issueOrderN(G,tm,'focus',v);G.cmdExp=Math.min(3,(G.cmdExp||0)+1);toast(r.sent?'集中攻撃を指示しました':`集中攻撃を指示（${r.n}/${r.tot}人が従う）`);}}
    if(v){
      const tg=uById(G,v);
      for(const u of G.units.filter(x=>!x.out&&x.team===tm&&canCtrl(x))){
        const p={},a=Math.round(angTo(u,tg.x,tg.y)),d=edist(u,tg.x,tg.y);
        if(isAtk(mainK(u))){p.md=a;p.mr=clamp(Math.ceil(d+0.5),rminOf(mainK(u),u),rmaxOf(G,u,mainK(u)));}
        if(isAtk(subK(u))){p.sd=a;p.sr=clamp(Math.ceil(d+0.5),rminOf(subK(u),u),rmaxOf(G,u,subK(u)));}
        else if(subK(u)==='shield')p.sd=a;
        if(Object.keys(p).length)setCtrl(u,p);
      }
      toast('全員の扇をその敵へ向けました');
    }
    render();
  }
  else if(a==='lock'){if(sel&&canCtrl(sel)){setCtrl(sel,{mu:(sel.mu||0)>=LOCKMU?0:LOCKMU});if(!isManual(G,sel))aimAll(G);render();}}
  else if(a==='autoback'){if(sel&&canCtrl(sel)){setCtrl(sel,{mu:0});aimAll(G);render();}}
  else if(a==='speed'){SPEED=v==='step'?'step':+v;clearTimeout(lTimer);lTimer=null;render();}
  else if(a==='dslot'){ui.dslot=v;render();}
  else if(a==='cyc'){if(sel&&canCtrl(sel)){const list=v==='m'?sel.main:sel.sub,cur=v==='m'?sel.ma:sel.sa;let n=cur;for(let i=1;i<=4;i++){const j=(cur+i)%4;if(list[j]!=='none'){n=j;break;}}if(n!==cur){setCtrl(sel,{[v==='m'?'ma':'sa']:n});if(sel[v==='m'?'am':'as'])aimAll(G);}render();}}
  else if(a==='submit'){if(MODE==='local')submitLocal();else submitOnline();}
  else if(a==='force'){if(confirm('未提出の部隊はその場で待機として、このラウンドを進めますか？'))hostTick(true);}
});
app.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.b,a=el.dataset.a;
  if(el.id==='mOfferIn'){ui.mOffer=el.value;return;}
  if(f==='pcsei'&&PCD){PCD.sei=el.value;return;}
  if(f==='pcmei'&&PCD){PCD.mei=el.value;return;}
  if(f&&DRAFT){const mi=+el.dataset.mi;if(f==='tname')DRAFT.name=el.value;else if(f==='mname')DRAFT.members[mi].name=el.value;return;}
  if((a==='mr'||a==='sr'||a==='sw'||a==='mw')&&G){
    const u=uById(G,el.dataset.u);if(!u||!canCtrl(u))return;
    setCtrl(u,{[a]:+el.value});
    if(a==='sw'||a==='mw'){const lb=app.querySelector(`[data-rl="${a}"]`);if(lb){const sl=a==='mw'?'m':'s';lb.textContent=`幅${u[a]*2}°／耐久${shieldHP(u,sl)}/${shieldMax(u,u[a])}`;}}
    else{const f2=fansOf(G,u).find(x=>x.slot===(a==='mr'?'m':'s'));const lb=app.querySelector(`[data-rl="${a==='mr'?'m':'s'}"]`);if(lb&&f2)lb.textContent=`${f2.r}マス／幅${Math.round(f2.half*2)}°`;}
    refreshFans();
  }
});
app.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.a,f=el.dataset.b;
  if((f==='main'||f==='sub')&&DRAFT){DRAFT.members[+el.dataset.mi][f][+el.dataset.si]=el.value;render();return;}
  if(a==='mr'||a==='sr'||a==='sw'||a==='mw'){el.blur();render();return;}
  if(a==='tteac'&&DRAFT){DRAFT.tac=el.value;render();return;}
  if((f==='mmain'||f==='msub')&&ui.mateDraft&&SCREEN==='mateedit'){ui.mateDraft[f==='mmain'?'main':'sub'][+el.dataset.si]=el.value;render();return;}
  if((f==='pmain'||f==='psub')&&PCD){PCD[f==='pmain'?'main':'sub'][+el.dataset.si]=el.value;render();return;}
  if(a==='ptac'){ui.ptac=el.value;render();return;}
  if(a==='lgcond'&&LEAGUE){const [lk,i]=el.dataset.v.split(':'),m=matchRef(lk,+i);if(m)m.cond=el.value;if(LEAGUE.me)LEAGUE.me.cond=el.value;lgSave();render();return;}
  if(a==='lsCond'){LS.cond=el.value;render();return;}
  if(a==='lsPlan'){OPTS.planSec=+el.value;optsSave();render();return;}
  if(a==='hostCond'&&G&&G.host===ME){G.cond=el.value;G.seq=(G.seq||0)+1;pushGame();renderLobby();return;}
  if(a==='rpjump'&&RP){RP.play=false;clearTimeout(RP.timer);const k=repRoundIdx(+el.value);if(k>=0)repGo(k,false);return;}
  if(a==='rpseek'&&RP){RP.play=false;clearTimeout(RP.timer);repGo(+el.value,false);return;}
  if(a==='lsN'){LS.n=+el.value;render();}
  else if(a==='lgmap'&&LEAGUE){const [lk,i]=el.dataset.v.split(':'),m=matchRef(lk,+i);if(m)m.map=+el.value;if(LEAGUE.me)LEAGUE.me.map=+el.value;lgSave();render();}
  else if(a==='lsMap'){LS.mapId=+el.value;render();}
  else if(a==='slotTeam'){LS.slots[+el.dataset.v].pick=el.value;}
  else if(a==='slotCpu'){LS.slots[+el.dataset.v].cpu=el.checked;}
  else if(a==='hostMap'&&G&&G.host===ME){G.mapId=+el.value;G.seq=(G.seq||0)+1;pushGame();renderLobby();}
  else if(a==='mySolo'){const o=soloList().find(x=>x.id===el.value);if(o){MYSEAT.spick=o.id;MYSEAT.team={name:o.m.name,tac:'balanced',members:[clone(o.m)]};saveSeat();renderLobby();}}
  else if(a==='myTeam'){const t=TEAMS.find(x=>x.id===el.value);MYSEAT.pick=el.value;MYSEAT.team=t?clone(t):randomTeam('おまかせ部隊');saveSeat();renderLobby();}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codein')joinRoom(e.target.value);});
app.addEventListener('pointerdown',e=>{
  if(isBM())return;
  if(!G||G.status!=='play'||!e.target.closest('#board .board'))return;
  const sel=ui.sel&&uById(G,ui.sel);if(!sel||!canCtrl(sel))return;
  const cell=e.target.closest('.c');
  if(cell){const u=unitAt(G,+cell.dataset.x,+cell.dataset.y);if(u&&canCtrl(u))return;}
  drag={id:sel.id,x0:e.clientX,y0:e.clientY,on:false,pid:e.pointerId,slot:ui.dslot==='s'?'s':'m'};
});
function dragMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8)return;
    drag.on=true;try{document.getElementById('board').setPointerCapture(e.pointerId);}catch(_){}
  }
  e.preventDefault();
  const bd=app.querySelector('#board .board'),u=uById(G,drag.id);
  if(!bd||!u||u.out||!canCtrl(u)){drag=null;return;}
  const r=bd.getBoundingClientRect();
  const gx=(e.clientX-r.left)/r.width*N-0.5,gy=(e.clientY-r.top)/r.height*N-0.5;
  const k=drag.slot==='m'?mainK(u):subK(u);
  const patch={[drag.slot==='m'?'md':'sd']:Math.round(Math.atan2(gy-u.y,gx-u.x)*180/Math.PI)};
  if(isAtk(k)&&rminOf(k,u)<rmaxOf(G,u,k))patch[drag.slot==='m'?'mr':'sr']=clamp(Math.round(Math.hypot(gx-u.x,gy-u.y)*2)/2,rminOf(k,u),rmaxOf(G,u,k));
  setCtrl(u,patch);refreshFans();
}
function dragEnd(e){
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  const was=drag.on;drag=null;
  if(was){ui.noClick=true;setTimeout(()=>{ui.noClick=false;},60);render();}
}
app.addEventListener('pointermove',dragMove,{passive:false});
app.addEventListener('pointerup',dragEnd);
app.addEventListener('pointercancel',dragEnd);

ME=(()=>{try{let id=localStorage.getItem('rt-pid');if(!id){id='p'+uid()+uid();localStorage.setItem('rt-pid',id);}return id;}catch(e){return 'p'+uid()+uid();}})();
TEAMS=lsTeams().map(sanitizeTeam);
render();
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(db){
        let id=null;try{id=user?await user.id():null;}catch(e){}
        REALID=!!id;
        if(!id){try{id=localStorage.getItem('rt-pid');if(!id){id='p'+uid();localStorage.setItem('rt-pid',id);}}catch(e){id='p'+uid();}}
        DB=db;if(REALID)DBID=id;
      }
    }
  }catch(e){}
  CAP=DB?'ok':'none';
  await loadTeams();
  if(['home','teams','local'].includes(SCREEN))render();
})();
